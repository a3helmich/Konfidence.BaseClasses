name: $(date:yyyyMMdd)$(rev:.r)

trigger: none

schedules:
- cron: '30 22 * * *'  # 00:30 W. Europe Standard Time (UTC+1)
  displayName: nightly build
  branches:
    include:
    - develop
  always: true

resources:
  repositories:
  - repository: templates
    type: git
    name: Konfidence/yaml.Templates
    ref: refs/heads/develop

variables:
- template: ComputeVersion.yml@templates
  parameters:
    majorVersion: 5
- name: BuildConfiguration
  value: release
- name: BuildPlatform
  value: 'any cpu'
- group: SqlSecurity
- group: nuget.org-apikeys

pool:
  name: Default

steps:
- checkout: self
  clean: true
  fetchDepth: 0

- template: VerifyVersionMatchesProps.yml@templates

- task: DotNetCoreCLI@2
  displayName: 'dotnet nuget locals all --clear'
  condition: eq(variables['Build.Reason'], 'Schedule')
  inputs:
    command: custom
    custom: nuget
    arguments: 'locals all --clear'

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: restore
    projects: '**\Konfidence.BaseClasses.sln'
    feedsToUse: config
    nugetConfigPath: .nuget/NuGet.Config
    verbosityRestore: Normal

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: '**\Konfidence.BaseClasses.sln'
    arguments: '-c $(BuildConfiguration) --no-restore /p:Version=$(year).$(majorVersion).$(minorVersion)'

# .\nuget is filled by the build step above, not by the dotnet pack step further down:
# Directory.Build.props sets GeneratePackageOnBuild for Release plus
# PackageOutputPath=$(SolutionDir)nuget, so building the solution in release already produces every
# package there. This step installs ClientSettingsUpdater (PackAsTool) from that folder so the two
# steps below it can write the SQL credentials the tests need.
# So the solution is packaged twice per run, deliberately: once at build time for this folder, and
# once via dotnet pack into the artifact staging directory for publishing. They cannot be collapsed
# as things stand - dotnet pack only runs for PullRequest builds, while this step runs on every
# build including the nightly, so pointing --add-source at the staging directory would break the
# nightly. Only ClientSettingsUpdater is actually needed here; the other packages in .\nuget are
# incidental. Accepted as-is: the cost is a few seconds and some disk.
- task: DotNetCoreCLI@2
  displayName: 'dotnet tool install ClientSettingsUpdater'
  inputs:
    command: custom
    custom: tool
    arguments: 'update -g ClientSettingsUpdater --add-source .\nuget'

- task: CmdLine@2
  displayName: 'update sql clientsettings konfidence2'
  inputs:
    script: 'clientsettingsupdater --ConfigFileFolder=. --UserName=$(SqlUser) --Password=$(SqlPassword) --Server=konfidence2'
    workingDirectory: ''
    failOnStderr: false

- task: CmdLine@2
  displayName: 'update sql clientsettings konfidence3'
  inputs:
    script: 'clientsettingsupdater --ConfigFileFolder=. --UserName=$(SqlUser) --Password=$(SqlPasswordKonfidence3) --Server=konfidence3'
    workingDirectory: ''
    failOnStderr: false

- task: DotNetCoreCLI@2
  displayName: 'dotnet test BaseClasses'
  inputs:
    command: test
    projects: '**\Konfidence.BaseClasses.sln'
    # The *.LocalDb.UnitTest projects (Konfidence.SqlHostProvider.LocalDb.UnitTest,
    # Konfidence.BaseDatabaseClasses.LocalDb.UnitTest, Konfidence.TestClasses.LocalDb.UnitTest)
    # exist to give GitHub Actions SQL-touching coverage it otherwise can't reach (it excludes
    # *.IntegrationTest.csproj, and this agent's Windows-service session can't run SQL Server
    # LocalDB - see LocalDbTestDatabase.cs in each project). This agent already covers that
    # surface via the real *.IntegrationTest projects below, so LocalDb projects are filtered out
    # here rather than made to pass under a constraint they can't meet.
    arguments: '-c $(BuildConfiguration) --no-build --verbosity normal --filter "FullyQualifiedName!~LocalDb.UnitTest" --collect:"XPlat Code Coverage" --settings coverlet.runsettings'
    publishTestResults: true

- template: GenerateAndPublishCodeCoverage.yml@templates

- template: VerifyNoRedundantReferences.yml@templates
  parameters:
    solution: Konfidence.BaseClasses

- task: DotNetCoreCLI@2
  displayName: 'dotnet pack'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: pack
    packagesToPack: '**\Konfidence.BaseClasses.sln'
    configurationToPack: '$(BuildConfiguration)'
    outputDir: '$(Build.ArtifactStagingDirectory)'
    nobuild: true
    includesymbols: true
    verbosityPack: Normal
    buildProperties: 'Version=$(year).$(majorVersion).$(minorVersion)'

- task: CopyFiles@2
  displayName: 'Copy Files to: \\konfidence8\publish'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    SourceFolder: '$(Build.ArtifactStagingDirectory)'
    # Everything except Konfidence.BaseClasses, which goes to nuget.org in the two steps below.
    # Publishing it to both meant the same version existed on the internal share and on nuget.org;
    # consumers now get it from nuget.org only. The exclusions deliberately mirror the globs those
    # push steps use, so the two stay in step - if one changes, change the other.
    # Versions already on the share are left alone (CleanTargetFolder is false), so anything pinned
    # to an older Konfidence.BaseClasses still restores from there.
    Contents: |
      **
      !Konfidence.BaseClasses.*.nupkg
      !Konfidence.BaseClasses.*.snupkg
    TargetFolder: '\\konfidence8\publish'
    CleanTargetFolder: false
    OverWrite: true
    flattenFolders: false
    preserveTimestamp: false

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish nuget.org package'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: custom
    custom: nuget
    arguments: 'push $(Build.ArtifactStagingDirectory)\Konfidence.BaseClasses.*.nupkg -s https://api.nuget.org/v3/index.json -k $(NuGetApiKey) --skip-duplicate'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish nuget.org symbols'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: custom
    custom: nuget
    arguments: 'push $(Build.ArtifactStagingDirectory)\Konfidence.BaseClasses.*.snupkg -s https://api.nuget.org/v3/index.json -k $(NuGetApiKey) --skip-duplicate'
