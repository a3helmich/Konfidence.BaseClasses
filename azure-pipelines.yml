name: $(date:yyyyMMdd)$(rev:.r)

trigger: none

schedules:
- cron: '30 22 * * *'  # 00:30 W. Europe Standard Time (UTC+1)
  displayName: nightly build
  branches:
    include:
    - develop
  always: true

resources:
  repositories:
  - repository: templates
    type: git
    name: Konfidence/yaml.Templates
    ref: refs/heads/develop

variables:
- template: ComputeVersion.yml@templates
  parameters:
    majorVersion: 4
- name: BuildConfiguration
  value: release
- name: BuildPlatform
  value: 'any cpu'
- group: SqlSecurity
- group: nuget.org-apikeys

pool:
  name: Default

steps:
- checkout: self
  clean: true
  fetchDepth: 0

# The published version and <Version> in Directory.Build.props are maintained separately and cannot
# be derived from one another: majorVersion is a template parameter, resolved before any step runs,
# so no runtime value can feed it. The props file only stamps local builds - CI passes
# /p:Version=... which overrides it - which is exactly why drift here goes unnoticed. This fails the
# build when they disagree.
# Year and major are compared; the minor is not. The pipeline's minorVersion is a counter that
# increments on every run, so it would match the props file exactly once and be wrong from the
# second build onward. The props file's minor is a separate, hand-maintained number.
# Note the year check fails by design each 1 January: the pipeline's year rolls over on its own
# while the props file cannot, and NuGet reads that leading segment as the semver major - so the
# repo must not keep claiming last year's version once a new one is being published.
- task: PowerShell@2
  displayName: 'Verify version matches Directory.Build.props'
  inputs:
    targetType: inline
    script: |
      $propsPath = Join-Path '$(Build.SourcesDirectory)' 'Directory.Build.props'
      $content = Get-Content -Raw -LiteralPath $propsPath

      if ($content -notmatch '<Version>\s*(\d+)\.(\d+)\.(\d+)\s*</Version>') {
          Write-Host "##vso[task.logissue type=error]Could not read a <Version> of the form year.major.minor from $propsPath"
          exit 1
      }

      $propsVersion = $Matches[0]
      $propsYear = [int]$Matches[1]
      $propsMajor = [int]$Matches[2]

      $pipelineYear = [int]'$(year)'
      $pipelineMajor = [int]'$(majorVersion)'

      $problems = @()

      if ($propsYear -ne $pipelineYear) {
          $problems += "year: props has $propsYear, pipeline has $pipelineYear"
      }

      if ($propsMajor -ne $pipelineMajor) {
          $problems += "major: props has $propsMajor, pipeline majorVersion is $pipelineMajor"
      }

      if ($problems.Count -gt 0) {
          $detail = $problems -join '; '

          if ($propsYear -ne $pipelineYear) {
              # A new year restarts the major at 1 by convention (see yaml.Templates/readme.md, and
              # the history: 2021.1.0, 2022.1.0, 2024.1.0). Nothing automates that - majorVersion is
              # a template parameter - so both files have to be edited by hand.
              Write-Host "##vso[task.logissue type=error]Version mismatch ($detail). The year has rolled over to $pipelineYear. By convention the major restarts at 1 for a new year, so set 'majorVersion: 1' in azure-pipelines.yml AND <Version> to $pipelineYear.1.1 in Directory.Build.props. Directory.Build.props currently reads $propsVersion."
              exit 1
          }

          Write-Host "##vso[task.logissue type=error]Version mismatch ($detail). Directory.Build.props reads $propsVersion but this build publishes $pipelineYear.$pipelineMajor.$(minorVersion). Update <Version> in Directory.Build.props to $pipelineYear.$pipelineMajor.1 before publishing."
          exit 1
      }

      Write-Host "Directory.Build.props ($propsVersion) matches this build's $pipelineYear.$pipelineMajor line."

- task: DotNetCoreCLI@2
  displayName: 'dotnet nuget locals all --clear'
  condition: eq(variables['Build.Reason'], 'Schedule')
  inputs:
    command: custom
    custom: nuget
    arguments: 'locals all --clear'

- task: DotNetCoreCLI@2
  displayName: 'dotnet restore'
  inputs:
    command: restore
    projects: '**\Konfidence.BaseClasses.sln'
    feedsToUse: config
    nugetConfigPath: .nuget/NuGet.Config
    verbosityRestore: Normal

- task: DotNetCoreCLI@2
  displayName: 'dotnet build'
  inputs:
    projects: '**\Konfidence.BaseClasses.sln'
    arguments: '-c $(BuildConfiguration) --no-restore /p:Version=$(year).$(majorVersion).$(minorVersion)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet tool install ClientSettingsUpdater'
  inputs:
    command: custom
    custom: tool
    arguments: 'update -g ClientSettingsUpdater --add-source .\nuget'

- task: CmdLine@2
  displayName: 'update sql clientsettings konfidence2'
  inputs:
    script: 'clientsettingsupdater --ConfigFileFolder=. --UserName=$(SqlUser) --Password=$(SqlPassword) --Server=konfidence2'
    workingDirectory: ''
    failOnStderr: false

- task: CmdLine@2
  displayName: 'update sql clientsettings konfidence3'
  inputs:
    script: 'clientsettingsupdater --ConfigFileFolder=. --UserName=$(SqlUser) --Password=$(SqlPasswordKonfidence3) --Server=konfidence3'
    workingDirectory: ''
    failOnStderr: false

- task: DotNetCoreCLI@2
  displayName: 'dotnet test BaseClasses'
  inputs:
    command: test
    projects: '**\Konfidence.BaseClasses.sln'
    # The *.LocalDb.UnitTest projects (Konfidence.SqlHostProvider.LocalDb.UnitTest,
    # Konfidence.BaseDatabaseClasses.LocalDb.UnitTest, Konfidence.TestClasses.LocalDb.UnitTest)
    # exist to give GitHub Actions SQL-touching coverage it otherwise can't reach (it excludes
    # *.IntegrationTest.csproj, and this agent's Windows-service session can't run SQL Server
    # LocalDB - see LocalDbTestDatabase.cs in each project). This agent already covers that
    # surface via the real *.IntegrationTest projects below, so LocalDb projects are filtered out
    # here rather than made to pass under a constraint they can't meet.
    arguments: '-c $(BuildConfiguration) --no-build --verbosity normal --filter "FullyQualifiedName!~LocalDb.UnitTest" --collect:"XPlat Code Coverage" --settings coverlet.runsettings'
    publishTestResults: true

- template: GenerateAndPublishCodeCoverage.yml@templates

- task: DotNetCoreCLI@2
  displayName: 'dotnet pack'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: pack
    packagesToPack: '**\Konfidence.BaseClasses.sln'
    configurationToPack: '$(BuildConfiguration)'
    outputDir: '$(Build.ArtifactStagingDirectory)'
    nobuild: true
    includesymbols: true
    verbosityPack: Normal
    buildProperties: 'Version=$(year).$(majorVersion).$(minorVersion)'

- task: CopyFiles@2
  displayName: 'Copy Files to: \\konfidence8\publish'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    SourceFolder: '$(Build.ArtifactStagingDirectory)'
    Contents: '**'
    TargetFolder: '\\konfidence8\publish'
    CleanTargetFolder: false
    OverWrite: true
    flattenFolders: false
    preserveTimestamp: false

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish nuget.org package'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: custom
    custom: nuget
    arguments: 'push $(Build.ArtifactStagingDirectory)\Konfidence.BaseClasses.*.nupkg -s https://api.nuget.org/v3/index.json -k $(NuGetApiKey) --skip-duplicate'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish nuget.org symbols'
  condition: eq(variables['Build.Reason'], 'PullRequest')
  inputs:
    command: custom
    custom: nuget
    arguments: 'push $(Build.ArtifactStagingDirectory)\Konfidence.BaseClasses.*.snupkg -s https://api.nuget.org/v3/index.json -k $(NuGetApiKey) --skip-duplicate'
